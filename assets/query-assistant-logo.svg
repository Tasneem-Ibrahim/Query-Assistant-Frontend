<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="light" x1="14" y1="10" x2="49" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7DA"/>
      <stop offset=".42" stop-color="#D9EAFF"/>
      <stop offset="1" stop-color="#75AEFF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#85B9FF" stop-opacity=".45"/>
